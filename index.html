<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Purchasing Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F6F7FA;--ink:#1D2733;--soft:#4F5864;--line:#E4E7EC;--card:#fff;--title:#14304F;--req:#F26A2E;--banner:#FBEFC2;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#12171E;--ink:#E8ECF1;--soft:#B3BCC8;--line:#2A333E;--card:#1B222B;--title:#BcD3F0;--banner:#3A3316}}
:root[data-theme="dark"]{--paper:#12171E;--ink:#E8ECF1;--soft:#B3BCC8;--line:#2A333E;--card:#1B222B;--title:#BcD3F0;--banner:#3A3316}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);font-family:'Inter',system-ui,sans-serif;color:var(--ink);padding:16px 12px}
.wrap{max-width:1220px;margin:0 auto}
h1{font-family:'Sora',system-ui,sans-serif;font-size:clamp(26px,3.6vw,36px);font-weight:700;color:var(--title);margin:0 0 4px}
p.sub{font-size:15px;color:var(--soft);margin:0 0 8px}
.scroll-shell{overflow:hidden;width:100%}
.stage{position:relative;width:940px;height:410px;transform-origin:top left}
svg.wave{position:absolute;top:0;left:0;width:940px;height:410px;overflow:visible}
.node-btn{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--card);z-index:5;cursor:pointer;padding:0;transition:transform .2s}
.node-btn:hover,.node-btn.active{transform:translate(-50%,-50%) scale(1.18)}
.node-btn:focus-visible{outline:3px solid var(--title);outline-offset:3px}
.node-btn i{width:8px;height:8px;border-radius:50%;pointer-events:none}
.node-btn.optional{border-style:dashed!important}
.node-num{position:absolute;transform:translateX(-50%);font-family:'Sora',sans-serif;font-size:13px;font-weight:700;color:var(--soft);pointer-events:none;z-index:5}
/* cards are placed in free gaps so they never cover any step button or number */
.card{position:absolute;top:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px;box-shadow:0 8px 22px rgba(20,48,79,.18);z-index:2;opacity:0;pointer-events:none;transition:opacity .25s}
.card.show{opacity:1;pointer-events:auto;z-index:4}
.card.optional{border:2px dashed #8E97A4}
.tag{font-size:12.5px;font-style:italic;color:var(--soft);margin:0 0 3px}
.card h3{font-family:'Sora',sans-serif;font-size:17.5px;font-weight:700;color:var(--title);margin:0 0 5px;line-height:1.2}
.card.optional h3{color:var(--soft)}
.card p.d{font-size:14.5px;line-height:1.38;color:var(--ink);margin:0}
.who{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.who h4{font-family:'Sora',sans-serif;font-size:12.5px;font-style:italic;font-weight:600;color:var(--title);margin:0 0 6px}
.person{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:14.5px;font-weight:500;line-height:1.25}
.person.req{color:var(--req);font-weight:600}
.av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.av svg{width:14px;height:14px}
.avs{display:flex;flex-shrink:0}
.av.sm{width:18px;height:18px;margin-left:-4px;border:2px solid var(--card)}
.av.sm:first-child{margin-left:0}
.av.sm svg{width:10px;height:10px}
.hint{text-align:center;font-size:13px;color:var(--soft);margin-top:8px}
.banner{max-width:940px;margin:12px auto 0;background:var(--banner);padding:12px 20px;text-align:center;font-family:'Sora',sans-serif;font-weight:600;font-size:14px;color:var(--title)}
</style>
</head>
<body>
<div class="wrap">
  <h1>The Purchasing Flow</h1>
  <p class="sub">Click each step to discover who is involved.</p>
  <div class="scroll-shell"><div class="stage" id="stage">
    <svg class="wave" viewBox="0 0 940 410"><defs>
      <linearGradient id="g" x1="0" y1="0" x2="940" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#E8C640"/><stop offset="20%" stop-color="#5FAE6A"/><stop offset="40%" stop-color="#F2A03B"/>
        <stop offset="60%" stop-color="#A9B0BC"/><stop offset="80%" stop-color="#D9A3C2"/><stop offset="100%" stop-color="#14304F"/>
      </linearGradient></defs>
      <path id="wavePath" fill="none" stroke="url(#g)" stroke-width="2.5"/></svg>
  </div></div>
  <p class="hint" id="hint">Click a numbered step above to reveal it.</p>
  <div class="banner">The Purchase Order &amp; Goods Receipt is matched to the Invoice for payment processing.</div>
</div>

<script>
const ico=(c)=>`<svg viewBox="0 0 24 24" fill="${c}"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>`;
const P={
  req:{n:"Requester",bg:"#F26A2E",ic:"#fff",cls:"req"},
  proc:{n:"Procurement",bg:"#14304F",ic:"#fff"},
  bo:{n:"Budget Owner",bg:"#2A3441",ic:"#fff"},
  doa:{n:"Delegation of Authority Approvers",multi:["#7DBB6A","#C99A5B","#2F6B3A","#D9D2C5"]},
  sup:{n:"Supplier",bg:"#DDE0D6",ic:"#4A5560"}
};
// cl = card left edge, cw = card width (both chosen to sit in a gap between step buttons/numbers)
const nodes=[
 {x:70,y:285,num:"01",color:"#E8C640",title:"Create a Purchase Requisition",
  desc:"The Requester creates a Purchase Requisition in Ivalua. This step includes sourcing/benchmark activities if needed.",who:["req","proc"],above:true,cl:4,cw:232},
 {x:250,y:125,num:"02",color:"#5FAE6A",title:"Wait for approval",
  desc:"The Budget Owner and Approvers review the request. Once approved, it is converted into a Purchase Order.",who:["bo","doa"],above:false,cl:272,cw:240},
 {x:430,y:285,num:"03",color:"#F2A03B",tag:"Automatic",title:"Issue Purchase Order",
  desc:"The supplier receives the Purchase Order.",who:["sup"],above:true,cl:310,cw:245},
 {x:610,y:125,num:"04",color:"#A9B0BC",tag:"Optional",optional:true,title:"Change / Cancel order",
  desc:"The Requester can adjust or cancel the order if plans change.",who:["req","sup"],above:false,cl:632,cw:230},
 {x:790,y:285,num:"05",color:"#D9A3C2",title:"Confirm Goods Receipt / Return",
  desc:"Confirm delivery or service completion. Return if wrong.",who:["req","sup"],above:true,cl:630,cw:232},
 {x:880,y:125,num:"06",color:"#14304F",title:"Close order",
  desc:"The order is closed once complete. After processing, the invoice will be available in Ivalua.",who:["req"],above:false,cl:630,cw:232}
];
const stage=document.getElementById("stage"),hint=document.getElementById("hint");
let d=`M ${nodes[0].x} ${nodes[0].y}`;
for(let i=0;i<nodes.length-1;i++){const a=nodes[i],b=nodes[i+1],m=(a.x+b.x)/2;d+=` C ${m} ${a.y}, ${m} ${b.y}, ${b.x} ${b.y}`}
document.getElementById("wavePath").setAttribute("d",d);

let active=null;
nodes.forEach((n,i)=>{
  const btn=document.createElement("button");
  btn.className="node-btn"+(n.optional?" optional":"");
  btn.style.left=n.x+"px";btn.style.top=n.y+"px";btn.style.border=`2.5px solid ${n.color}`;
  btn.setAttribute("aria-label","Step "+n.num+": "+n.title);
  btn.innerHTML=`<i style="background:${n.color}"></i>`;
  stage.appendChild(btn);

  const num=document.createElement("div");
  num.className="node-num";num.textContent=n.num;num.style.left=n.x+"px";
  num.style.top=(n.above?n.y+18:n.y-32)+"px";
  stage.appendChild(num);

  const card=document.createElement("div");
  card.className="card"+(n.optional?" optional":"");
  card.style.left=n.cl+"px";card.style.width=n.cw+"px";

  const people=n.who.map(k=>{
    const p=P[k];
    const av=p.multi?`<span class="avs">${p.multi.map(c=>`<span class="av sm" style="background:${c}">${ico("#fff")}</span>`).join("")}</span>`:`<span class="av" style="background:${p.bg}">${ico(p.ic)}</span>`;
    return `<div class="person ${p.cls||""}">${av}<span>${p.n}</span></div>`;
  }).join("");
  card.innerHTML=`${n.tag?`<p class="tag">${n.tag}</p>`:""}<h3>${n.title}</h3><p class="d">${n.desc}</p>
    <div class="who"><h4>Who is involved?</h4>${people}</div>`;
  stage.appendChild(card);

  // sit just above the lower row of buttons (bottom edge at y=266), never above the stage top
  const place=()=>{card.style.top=Math.max(4,266-card.offsetHeight)+"px"};
  place();

  btn.addEventListener("click",()=>{
    const was=active===i;
    document.querySelectorAll(".card").forEach(c=>c.classList.remove("show"));
    document.querySelectorAll(".node-btn").forEach(b=>b.classList.remove("active"));
    if(was){active=null;hint.style.display="block"}
    else{place();card.classList.add("show");btn.classList.add("active");active=i;hint.style.display="none"}
  });
});
const shell=document.querySelector(".scroll-shell");
function fit(){
  const s=Math.min(0.85,shell.clientWidth/940);
  stage.style.transform=`scale(${s})`;
  stage.style.marginLeft=Math.max(0,(shell.clientWidth-940*s)/2)+"px";
  shell.style.height=(410*s)+"px";
}
fit();addEventListener("resize",fit);
</script>
</body>
</html>
